<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>שרה אנקוה | אסטרטגיה ונכסים דיגיטליים</title>
<link rel="preload" as="image" href="assets/hero/object.webp" type="image/webp">
<style>
@font-face{font-family:"Sara Ankava";src:url("assets/fonts/SaraAnkava-Bold-v1.2.woff2") format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Sara Ankava";src:url("assets/fonts/SaraAnkava-Medium-v1.2.woff2") format("woff2");font-weight:500;font-display:swap}
:root{--bg:#0E0F0D;--ink:#F1F2EC;--ink-70:rgb(241 242 236 / .72);--lime:#C8FF3A;--char:#1A1B19}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Sara Ankava",system-ui,sans-serif}
body{min-height:100svh;overflow-x:hidden}
.hero{position:relative;min-height:100svh;display:grid;grid-template-columns:max-content clamp(280px,26vw,400px);justify-content:center;align-items:center;column-gap:clamp(8px,2vw,36px);padding:clamp(24px,4vw,64px)}
.veil{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:0;pointer-events:none;background:radial-gradient(60% 55% at 45% 50%,#1b1d17 0%,var(--bg) 75%);-webkit-mask-image:radial-gradient(ellipse 72% 68% at 50% 50%,#000 30%,transparent 100%);mask-image:radial-gradient(ellipse 72% 68% at 50% 50%,#000 30%,transparent 100%)}
.hero__text{position:relative;z-index:2}
.eyebrow{margin:0 0 28px;font-weight:500;font-size:18px;color:var(--lime)}
.hero h1{margin:0;font-weight:700;font-size:clamp(36px,3.9vw,64px);line-height:1.06;letter-spacing:-.01em}
.hero h1 .ln{display:block;white-space:nowrap;overflow:hidden;padding:.06em 0}
.hero h1 .ln>span{display:block;transform:translateX(-110%);animation:from-tail 1s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(.5s + var(--i)*.14s)}
.hero h1 em{font-style:normal;color:var(--lime)}
@keyframes from-tail{to{transform:none}}
.hero__p{margin:28px 0 0;font-size:18px;line-height:1.5;color:var(--ink-70);max-width:30em;opacity:0;animation:fade .8s ease forwards 1.1s}
.cta{display:inline-flex;align-items:center;gap:14px;margin-top:36px;padding:16px 28px;border-radius:999px;background:var(--lime);color:#11120F;font:700 18px "Sara Ankava",system-ui,sans-serif;text-decoration:none;opacity:0;animation:fade .8s ease forwards 1.3s;transition:transform .25s}
.cta:hover{transform:translateX(-4px)}
.cta svg{width:22px;height:22px}
@keyframes fade{to{opacity:1}}

/* האובייקט: התמונה מפוצלת לשתי שכבות מאותו קובץ. mix-blend-mode: screen מעלים את השחור */
.obj{position:relative;z-index:1;width:100%;aspect-ratio:1;justify-self:start;perspective:1100px;mix-blend-mode:screen;opacity:0;animation:fade 1.2s ease forwards .1s}
.obj__tilt{position:absolute;inset:0;will-change:transform}
.layer{position:absolute;inset:0;background:url("assets/hero/object.webp") center/100% 100% no-repeat;will-change:transform}
.layer--a{clip-path:polygon(0 0,100% 0,100% 54%,78.8% 54%,78.8% 73%,100% 73%,100% 100%,0 100%)}
.layer--sq{clip-path:polygon(78.8% 54%,100% 54%,100% 73%,78.8% 73%)}
.float-a{position:absolute;inset:0;animation:bob 7s ease-in-out infinite}
.float-sq{position:absolute;inset:0;animation:bob 5s ease-in-out infinite reverse}
@keyframes bob{50%{transform:translateY(-1.6%)}}
/* פס אור: מוסתר דרך התמונה עצמה, כך שהוא עובר רק על הזכוכית */
.sweep{position:absolute;inset:0;-webkit-mask:url("assets/hero/object.webp") center/100% 100% no-repeat;mask:url("assets/hero/object.webp") center/100% 100% no-repeat;-webkit-mask-mode:luminance;mask-mode:luminance;mix-blend-mode:screen;pointer-events:none;overflow:hidden}
.sweep::after{content:"";position:absolute;top:-20%;bottom:-20%;width:22%;left:0;background:linear-gradient(100deg,transparent,rgb(255 255 255 / .85) 50%,transparent);transform:translateX(-120%) skewX(-18deg);animation:sweep 6.5s ease-in-out infinite 1.6s}
@keyframes sweep{0%{transform:translateX(-120%) skewX(-18deg)}38%,100%{transform:translateX(560%) skewX(-18deg)}}

@media (max-width:820px){
  .veil{display:none}
  .hero{grid-template-columns:1fr;align-content:center;gap:0;padding:28px 20px 48px}
  .obj{order:-1;max-width:300px;margin:0 auto -4%}
  .hero h1{font-size:clamp(26px,7.7vw,34px)}
  .hero h1 .ln{white-space:normal}.hero h1 .ln>span{transform:translateY(100%)}
  .hero__text{max-width:none}
  .hero{background:radial-gradient(70% 40% at 50% 22%,#1b1d17 0%,var(--bg) 80%)}
}
@media (prefers-reduced-motion:reduce){
  .float-a,.float-sq,.sweep::after{animation:none}
  .hero h1 .ln>span,.hero__p,.cta,.obj{animation:none;transform:none;opacity:1}
  .sweep{display:none}
}
@media (prefers-reduced-motion:reduce){.veil{display:block}}
</style>
</head>
<body>
<main>
  <section class="hero" aria-labelledby="hero-title">
    <canvas class="veil" id="veil" aria-hidden="true"></canvas>
    <div class="hero__text">
      <p class="eyebrow">שרה אנקוה · אסטרטגיה ונכסים דיגיטליים</p>
      <h1 id="hero-title">
        <span class="ln" style="--i:0"><span>העסק שלכם הצליח בפה לאוזן.</span></span>
        <span class="ln" style="--i:1"><span>הגיע הזמן לשלב <em>הבא.</em></span></span>
      </h1>
      <p class="hero__p">מתחילים מהבנה של העסק שלכם, ואז בונים תוכנית שיווק ונכס דיגיטלי אחד שלוקחים אותו רחוק יותר.</p>
      <a class="cta" href="https://wa.me/972533175560"><span>בואו נדבר</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
    </div>
    <div class="obj" role="img" aria-label="האות a בזכוכית ליים, בצורת בועת דיבור, והריבוע מהלוגו">
      <div class="obj__tilt" id="tilt">
        <div class="float-a"><div class="layer layer--a" id="la"></div></div>
        <div class="float-sq"><div class="layer layer--sq" id="ls"></div></div>
        <div class="sweep"></div>
      </div>
    </div>
  </section>
</main>
<script>
/* רקע "צעיף": שדה זורם כהה, בלי bloom, מגיב לעכבר. סטטי במובייל ו-reduced-motion */
(() => {
  const cv = document.getElementById("veil");
  if (!matchMedia("(hover:hover) and (pointer:fine) and (min-width:821px)").matches || matchMedia("(prefers-reduced-motion:reduce)").matches) return;
  const gl = cv.getContext("webgl", { antialias: false, alpha: false }); if (!gl) return;
  const sh = (t, s) => { const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); return o; };
  const pr = gl.createProgram();
  gl.attachShader(pr, sh(gl.VERTEX_SHADER, "attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}"));
  gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, `precision mediump float;uniform vec2 r;uniform float t;uniform vec2 m;
void main(){
  vec2 uv=(gl_FragCoord.xy-.5*r)/r.y; vec2 p=uv*1.5+(m-.5)*vec2(.5,-.5);
  for(int i=0;i<4;i++){float k=float(i);p+=.5*vec2(sin(p.y*1.7+t*.09+k*1.3),cos(p.x*1.5-t*.07+k*2.1));}
  float v=sin(p.x*2.2+p.y*1.4)*.5+.5; float w=sin(length(p)*2.6-t*.12)*.5+.5;
  float h=smoothstep(.3,.95,v*w*1.7);
  float md=length(uv-(m-.5)*vec2(r.x/r.y,-1.));h+=.25*smoothstep(.7,.0,md)*h;
  vec3 base=vec3(.055,.059,.051);vec3 tint=vec3(.085,.098,.060);
  gl_FragColor=vec4(base+tint*h*.55,1.);}`));
  gl.linkProgram(pr); gl.useProgram(pr);
  const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,3,-1,-1,3]), gl.STATIC_DRAW);
  const a = gl.getAttribLocation(pr, "p"); gl.enableVertexAttribArray(a); gl.vertexAttribPointer(a, 2, gl.FLOAT, false, 0, 0);
  const U = n => gl.getUniformLocation(pr, n);
  const size = () => { cv.width = Math.ceil(cv.clientWidth * .5); cv.height = Math.ceil(cv.clientHeight * .5); gl.viewport(0, 0, cv.width, cv.height); };
  size(); addEventListener("resize", size);
  let tx = .5, ty = .5, x = .5, y = .5;
  addEventListener("pointermove", e => { tx = e.clientX / innerWidth; ty = e.clientY / innerHeight; });
  const t0 = performance.now();
  const loop = () => {
    requestAnimationFrame(loop); if (document.hidden) return;
    x += (tx - x) * .04; y += (ty - y) * .04;
    gl.uniform2f(U("r"), cv.width, cv.height); gl.uniform1f(U("t"), (performance.now() - t0) / 1000); gl.uniform2f(U("m"), x, y);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  };
  loop();
})();
(() => {
  const tilt = document.getElementById('tilt'), la = document.getElementById('la'), ls = document.getElementById('ls');
  const fine = matchMedia('(hover:hover) and (pointer:fine) and (min-width:821px)').matches;
  if (!fine || matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  let tx = 0, ty = 0, x = 0, y = 0;
  addEventListener('pointermove', e => { tx = e.clientX / innerWidth - .5; ty = e.clientY / innerHeight - .5; });
  const loop = () => {
    x += (tx - x) * .06; y += (ty - y) * .06;
    tilt.style.transform = `rotateY(${x * 12}deg) rotateX(${-y * 9}deg)`;
    la.style.transform = `translate(${x * -10}px,${y * -8}px)`;
    ls.style.transform = `translate(${x * -34}px,${y * -26}px)`;
    requestAnimationFrame(loop);
  };
  loop();
})();
</script>
<script>if(location.hash==="#still"){const s=document.createElement("style");s.textContent=".hero h1 .ln>span,.hero__p,.cta,.obj{animation:none!important;transform:none!important;opacity:1!important}.sweep{display:none}";document.head.appendChild(s)}</script>
</body>
</html>
