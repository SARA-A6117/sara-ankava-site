<!doctype html>
<html lang="he" dir="rtl" data-theme="light">
<head>

<title>העמוד לא נמצא — Sara Ankava</title>

<meta name="robots" content="noindex">

<style>
@font-face{font-family:"Google Sans";src:url("assets/fonts/GoogleSans-Variable.subset.woff2") format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:"Sara Ankava";src:url("assets/fonts/SaraAnkava-Medium-v1.2.woff2") format("woff2");font-weight:500;font-display:swap}
*{box-sizing:border-box}
html,body{margin:0;min-height:100vh;background:#F3EEE2;color:#1E201F;font:300 18px/1.6 "Google Sans","Heebo",system-ui,sans-serif}
body{display:grid;place-items:center;padding:24px;text-align:center;background-image:linear-gradient(rgb(30 32 31 / .09) 1px,transparent 1px);background-size:100% 112px}
main{display:grid;gap:18px;justify-items:center}
.logo{display:block;width:180px;margin-bottom:12px}
.logo img{width:100%;height:auto;display:block}
h1{margin:0;font:900 clamp(72px,16vw,180px)/.9 "Google Sans","Heebo",sans-serif;letter-spacing:-.02em}
h1 span{display:inline-block}
p{margin:0;max-width:34ch}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 28px;border-radius:999px;font:500 17px/1 "Sara Ankava","Heebo",sans-serif;text-decoration:none;margin-top:10px}
.btn::after{content:"";position:absolute;bottom:-8px;left:22px;width:16px;height:11px;background:#2A45D8;clip-path:polygon(0 0,100% 0,0 100%)}
a:focus-visible{outline:2px solid #1B33C9;outline-offset:3px}
</style>
</head>
<body>
<main id="main">
  <a class="logo" href="/" aria-label="Sara Ankava, לדף הבית"><img src="assets/brand/logo-black.png" width="1066" height="123" alt="Sara Ankava"></a>

  <a class="btn" data-gn="btn" href="/">חזרה לדף הבית</a>
</main>
</body>
</html>
