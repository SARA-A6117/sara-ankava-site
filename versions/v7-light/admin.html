<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ניהול — Sara Ankava</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1E201F">
<link rel="icon" href="assets/brand/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/admin.css?v=3">
</head>
<body>
<header class="cp-top">
  <span class="cp-brand">Sara Ankava <small>ניהול</small></span>
  <div class="cp-user" id="user" hidden><span id="user-mail"></span><button type="button" class="cp-btn cp-btn--ghost" id="logout">התנתקות</button></div>
</header>

<main class="cp-main">
  <section class="cp-login" id="login">
    <h1>כניסה למערכת הניהול</h1>
    <p id="login-msg" class="cp-msg" role="alert"></p>
    <button type="button" class="cp-btn cp-btn--grad" id="google">התחברות עם גוגל</button>
  </section>

  <section id="app" hidden>
    <nav class="cp-tabs" role="tablist">
      <button type="button" role="tab" id="tab-projects" aria-selected="true" aria-controls="pane-projects">פרויקטים</button>
      <button type="button" role="tab" id="tab-leads" aria-selected="false" aria-controls="pane-leads">פניות <b id="leads-new" hidden></b></button>
    </nav>

    <div id="pane-projects" role="tabpanel">
      <div class="cp-bar"><p class="cp-hint">גררו כדי לשנות סדר (או השתמשו בחצים). הסדר נשמר מיד.</p><button type="button" class="cp-btn cp-btn--grad" id="add">הוספת פרויקט</button></div>
      <ul class="cp-list" id="projects" aria-live="polite"></ul>
    </div>

    <div id="pane-leads" role="tabpanel" hidden>
      <div class="cp-bar">
        <label class="cp-field cp-field--inline">חיפוש<input type="search" id="lead-search" placeholder="שם, טלפון, עסק, הערה" autocomplete="off"></label>
        <label class="cp-field cp-field--inline">סינון
          <select id="lead-filter"><option value="">הכול</option><option value="new">חדש</option><option value="in_progress">בטיפול</option><option value="closed">סגור</option></select>
        </label>
      </div>
      <ul class="cp-list" id="leads" aria-live="polite"></ul>
    </div>
  </section>

  <p class="cp-msg" id="global-msg" role="alert"></p>
</main>

<div class="cp-modal" id="modal" hidden>
  <form class="cp-sheet" id="pform" novalidate>
    <h2 id="pform-title">פרויקט</h2>
    <label class="cp-field">שם הפרויקט<input name="title" required maxlength="200"></label>
    <label class="cp-field">שורת סוג<input name="type" maxlength="200" placeholder="למשל: אתר תדמית · קטלוג"></label>
    <label class="cp-field">תיאור<textarea name="description" rows="4" maxlength="2000"></textarea></label>
    <label class="cp-field">קישור (לא חובה)<input name="link" type="url" dir="ltr" placeholder="https://" maxlength="500"></label>
    <div class="cp-imgs">
      <div class="cp-img"><span>תמונת דסקטופ</span><div class="cp-prev" id="prev-desktop"></div><input type="file" accept="image/*" id="file-desktop"></div>
      <div class="cp-img"><span>תמונת מובייל</span><div class="cp-prev" id="prev-mobile"></div><input type="file" accept="image/*" id="file-mobile"></div>
    </div>
    <label class="cp-check"><input type="checkbox" name="is_concept"> להציג "קונספט"</label>
    <label class="cp-check"><input type="checkbox" name="published"> מפורסם באתר</label>
    <p class="cp-msg" id="pform-msg" role="alert"></p>
    <div class="cp-actions"><button type="submit" class="cp-btn cp-btn--grad" id="psave">שמירה</button><button type="button" class="cp-btn cp-btn--ghost" id="pcancel">ביטול</button></div>
  </form>
</div>

<div class="cp-modal" id="confirm" hidden>
  <div class="cp-sheet cp-sheet--sm" role="alertdialog" aria-labelledby="confirm-t">
    <h2 id="confirm-t">למחוק את הפרויקט?</h2>
    <p id="confirm-p"></p>
    <div class="cp-actions"><button type="button" class="cp-btn cp-btn--danger" id="confirm-yes">מחיקה</button><button type="button" class="cp-btn cp-btn--ghost" id="confirm-no">ביטול</button></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="assets/js/admin-config.js?v=2"></script>
<script src="assets/js/admin.js?v=4"></script>
</body>
</html>
